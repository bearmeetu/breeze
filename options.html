<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Breeze AI 配置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Breeze AI 配置</h1>
    
    <div class="form-group">
      <label for="baseUrl">AI Base URL (例如: http://internal.ai.server/v1):</label>
      <input type="text" id="baseUrl" placeholder="http://...">
    </div>

    <div class="form-group">
      <label for="apiKey">API Key (Bearer Token):</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>

    <div class="form-group">
      <label>模型列表 (Models):</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="newModelInput" placeholder="输入模型名称 (如: gpt-4)">
        <button id="addModelBtn" type="button" style="width: auto;">添加</button>
      </div>
      <ul id="modelList" class="model-list"></ul>
    </div>

    <div class="form-group">
      <label for="searchUrl">内网搜索 URL (使用 %s 代表搜索词):</label>
      <input type="text" id="searchUrl" placeholder="http://search.internal/?q=%s">
    </div>

    <button id="saveBtn">保存配置</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
